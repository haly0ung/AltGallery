name: Update added-apps.json

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'apps/Gopeed/**'
      - 'apps/Cloudn/**'
      - 'apps/WQFiles/**'
      - 'assets/added-merge.toml'
      - '.github/workflows/added-apps.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Regenerate the three added app sources
        run: |
          set -euo pipefail
          for app in Gopeed Cloudn WQFiles; do
            echo "==> Updating apps/$app"
            (cd "apps/$app" && uvx altgen -c config.toml)
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into added-apps.json
        run: uvx altgen merge -c assets/added-merge.toml apps/Gopeed/apps.json apps/Cloudn/apps.json apps/WQFiles/apps.json

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain added-apps.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add added-apps.json
          git commit -m "chore: update added-apps.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
