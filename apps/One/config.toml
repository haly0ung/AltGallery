# altgen config for the One AltStore source.
# Run: uvx altgen -c config.toml
# One: ONE 一个原生 iOS 客户端

[github]
repo = "ios151/One-releases"

[source]
name = "One"
subtitle = "One AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for One"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery/refs/heads/master/apps/One/icon.png"
website = "https://github.com/ios151/One-releases"
tint_color = "#000000"

[app]
name = "One"
bundle_identifier = "com.ios151.one"
developer_name = "ios151"
subtitle = "ONE 一个原生 iOS 客户端"
description = "ONE 一个原生 iOS 客户端，影视类内容浏览与播放。"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery/refs/heads/master/apps/One/icon.png"
tint_color = "#000000"
min_os_version = "16.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Each release contains: One-unsigned.ipa
asset_pattern = 'One-unsigned\.ipa$'

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/haly0ung/AltGallery/refs/heads/master/apps/One/images/news.png"

[output]
path = "apps.json"
