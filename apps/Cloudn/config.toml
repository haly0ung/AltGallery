# altgen config for the Cloudn AltStore source.
# Run: uvx altgen -c config.toml
# Cloudn: paste a link, parse/preview/download cloud shares, videos and magnets

[github]
repo = "mengangs/Cloudn"

[source]
name = "Cloudn"
subtitle = "Cloudn AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Cloudn"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery/refs/heads/master/apps/Cloudn/icon.png"
website = "https://github.com/mengangs/Cloudn"
tint_color = "#B4532F"

[app]
name = "Cloudn"
bundle_identifier = "com.mengangs.Cloudn"
developer_name = "mengangs"
subtitle = "Paste a link, and let it handle the rest"
description = "Paste a link and let it handle the rest. Cloud drive shares, short videos, web videos, GitHub, and magnet links — one app to parse, preview, and download fast. Free and open source, no ads, no server; all parsing happens on-device."
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery/refs/heads/master/apps/Cloudn/icon.png"
tint_color = "#B4532F"
min_os_version = "17.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Each release contains: Cloudn-v<version>.ipa (+ SHA256SUMS.txt)
asset_pattern = 'Cloudn-v.*\.ipa$'

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/haly0ung/AltGallery/refs/heads/master/apps/Cloudn/images/news.png"

[output]
path = "apps.json"
