# altgen merge config for the added-apps source: only the apps added to this
# fork (Gopeed, Cloudn, WQFiles), as a small standalone source that always
# displays in full.
# Run: uvx altgen merge -c assets/added-merge.toml apps/Gopeed/apps.json apps/Cloudn/apps.json apps/WQFiles/apps.json
#
# Merge mode only reads [source] (root source metadata) and [output];
# the apps and news entries are extracted from the input apps.json files.
# Build-mode tables ([github], [app], [versions], [news]) are rejected.

[source]
name = "AltGallery Added"
subtitle = "Apps added to this AltGallery fork"
description = "AltStore source with the apps added to this fork, generated from GitHub Releases"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery/refs/heads/master/assets/icon.png"
website = "https://github.com/haly0ung/AltGallery"
tint_color = "#3B82F6"

[output]
path = "../added-apps.json"   # resolved against THIS file's directory -> repo root added-apps.json
